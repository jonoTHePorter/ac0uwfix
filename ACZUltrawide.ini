[Ultrawide]
; 1 = on, 0 = off
Enabled=1
; Resolution to add to the launcher. 0 = use the desktop resolution. Maximum width is 4095.
Width=0
Height=0
; Hor+ field of view in missions. 0 leaves the picture stretched.
FixFOV=1

[HUD]
; 1 = HUD, subtitles, movies and info cards in a centered 16:9 area. 0 = stretched to the full width.
FixHUD=1

[Debug]
; 1 = F10 dumps draw calls, F9 reloads this file
Debug=0
